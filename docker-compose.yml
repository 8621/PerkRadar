# Compose project is fixed so this stack does not follow the directory name
# and does not attach to another project's network, volume, or containers.
name: perkradar

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: perkradar:local
    container_name: perkradar
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Host loopback only. Override the host port with HOST_PORT if 38471 is taken.
      # The process inside the container always listens on 38471.
      - "127.0.0.1:${HOST_PORT:-38471}:38471"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "38471"
      HOST: "0.0.0.0"
      PERKRADAR_ACCESS_TOKEN: ${PERKRADAR_ACCESS_TOKEN:-}
      PERKRADAR_SECURE_COOKIE: ${PERKRADAR_SECURE_COOKIE:-1}
      DATA_DIR: /data
      JINA_API_KEY: ${JINA_API_KEY:-}
      JINA_API_KEY_FILE: ${JINA_API_KEY_FILE:-}
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:38471/api/health',{headers:process.env.PERKRADAR_ACCESS_TOKEN?{Authorization:'Bearer '+process.env.PERKRADAR_ACCESS_TOKEN}:{}}).then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
