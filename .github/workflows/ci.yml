name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests (offline fixtures only)
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit --incremental false
      - name: Production build
        run: npm run build
      - name: Static snapshot viewer build
        run: npm run build:snapshot
      # Some npm mirrors do not implement the audit endpoint. Pin the official
      # registry so this step fails on real advisories, not on a mirror error.
      - name: Production dependency audit
        run: npm audit --omit=dev --registry=https://registry.npmjs.org
