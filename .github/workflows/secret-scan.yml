name: Secret scan

# Full-history scan: a secret committed and later deleted is still exposed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC; 05:17 UTC = 13:17 Beijing time.
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep the job working with contents: read only.
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
